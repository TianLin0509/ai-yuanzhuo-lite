name: Verify Lite
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
