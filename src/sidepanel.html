<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI圆桌lite</title><link rel="stylesheet" href="sidepanel.css"></head><body>
<header><div class="brand-row"><span class="brand-icon">◈</span><strong>AI圆桌<span class="lite">LITE</span></strong><div class="head-actions"><button id="history" class="icon-button" title="历史圆桌" aria-label="历史圆桌">◷</button><button id="new" class="icon-button" title="新建圆桌" aria-label="新建圆桌">＋</button><button id="menu" class="icon-button" title="更多操作" aria-label="更多操作">···</button></div></div><div class="members" id="member-strip"></div><button id="open-sidepanel" hidden>在网页旁打开圆桌侧栏</button></header>
<div id="error-banner" role="alert" hidden></div>
<main id="main"><section id="empty" hidden><div class="empty-icon">◈</div><h1>一个问题，多种视角。</h1><p>选择你常用的网页 AI，<br>让它们独立回答，再继续讨论。</p><button id="connect" class="primary">打开并连接三家网页</button><p class="hint">先在各家网页完成登录，然后回到这里提问。</p></section><section id="conversation" hidden><div class="topic-meta"><span id="session-title"></span><button id="rounds"></button></div><h1 id="question"></h1><div class="progress"><span id="kind"></span><span id="progress-text"></span></div><div id="answers"></div></section></main>
<footer><div class="compose-label"><label for="prompt">继续这场圆桌</label><span id="member-count"></span></div><div class="compose-box"><textarea id="prompt" rows="2" placeholder="输入问题，或写下这一轮的讨论要求…"></textarea><div class="compose-bottom"><small>原文发送 · Ctrl + Enter</small><button id="send" class="primary">开始圆桌 ↑</button></div></div><div class="round-actions"><button id="summary">队长总结</button><button id="discuss">观点讨论</button><button id="iterate">独立迭代</button></div></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog><div id="notice" role="status" aria-live="polite" hidden></div>
<script src="vendor/purify.min.js"></script><script src="vendor/marked.umd.js"></script><script type="module" src="sidepanel.js"></script></body></html>
