<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI圆桌lite · 圆桌记录</title><link rel="stylesheet" href="sidepanel.css"></head><body data-surface="main"><header class="app-head"><span class="mark" aria-hidden="true">◈</span><strong class="brand-name">AI圆桌</strong><span id="session-title" class="app-caption"></span><span class="grow"></span><button id="update" class="primary" hidden></button><button id="new">新建圆桌</button><button id="export">导出</button><button id="open-sidepanel">打开侧栏</button></header><div id="error-banner" role="alert" hidden></div><div class="desktop"><aside class="timeline"><label class="sr-only" for="time-search">搜索提问与回答</label><input id="time-search" type="search" placeholder="搜索提问与回答"><nav id="time-list" aria-label="按提问时间回看"></nav><div class="timeline-foot"><button id="history" class="link">历史圆桌</button><button id="latest" class="link">回到最新</button></div></aside><main class="reading"><header class="work-head"><h1 id="question">一个问题，多种视角。</h1><div class="meta-row"><div id="round-meta"></div><div id="layouts" class="seg" role="group" aria-label="阅读方式"><button data-layout="a">单篇</button><button data-layout="b">对读</button><button data-layout="c">索引</button></div></div></header><div id="source" hidden></div><div id="reader"><section id="empty"><h2>先提出你的第一个问题</h2><p>在操作区选择成员并连接网页，完成登录后开始。每次提问和各家的回答都会按时间保留在左侧。</p></section></div><section id="dock"><details open><summary>继续这场圆桌<span>草稿与侧栏同步</span></summary><div id="controller" class="controller"></div></details></section><div id="panel-active" hidden>下一轮操作在 Chrome 侧栏中，这里用于阅读记录。</div></main></div><dialog id="dialog" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭">×</button></header><div id="dialog-body"></div></dialog><div id="notice" role="status" aria-live="polite" hidden></div><script src="vendor/purify.min.js"></script><script src="vendor/marked.umd.js"></script><script type="module" src="sidepanel.js"></script></body></html>
